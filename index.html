<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema de Fichas</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <button id="theme-toggle" class="theme-btn">Modo Oscuro</button>

    <div class="login-card">
        <img src="assets/logo.png" alt="Logo del Sistema" class="logo" id="logo-img">

        <h2 id="titulo-form">Iniciar Sesión</h2>

        <form id="loginForm">
            <input type="text" id="nombre_completo" placeholder="Tu nombre completo (Ej. Juan Pérez)"
                style="display: none;" autocomplete="off">
            <input type="text" id="username" placeholder="Usuario" required autocomplete="off">

            <div class="password-container">
                <input type="password" id="password" placeholder="Contraseña" required>
                <button type="button" id="btn-ojito" class="btn-ojito">
                    <i class="fa-solid fa-eye" id="icono-ojo"></i>
                </button>
            </div>

            <button type="submit" class="btn" id="btn-submit">Entrar</button>
        </form>

        <p style="text-align: center; margin-top: 15px; font-size: 0.9em;">
            <a href="#" id="toggle-form" style="color: #3b82f6; text-decoration: none;">¿No tienes cuenta? Regístrate
                aquí</a>
        </p>
        <div id="message" class="error"></div>
    </div>

    <script src="login.js"></script>
</body>

</html>
