<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema de Fichas</title>
    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-card: white;
            --text-main: #374151;
            --border-input: #d1d5db;
            --bg-input: white;
            --text-input: #000;
        }

        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 1.5rem;
        }

        body.dark-theme {
            --bg-body: #111827;
            --bg-card: #1f2937;
            --text-main: #f9fafb;
            --border-input: #4b5563;
            --bg-input: #374151;
            --text-input: #f9fafb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .login-card {
            background-color: var(--bg-card);
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 320px;
            text-align: center;
            transition: background-color 0.3s;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-input);
            background-color: var(--bg-input);
            color: var(--text-input);
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .theme-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: auto;
            background: none;
            border: 1px solid var(--border-input);
            color: var(--text-main);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: normal;
        }

        .theme-btn:hover {
            background-color: var(--border-input);
        }

        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2563eb;
        }

        #error-msg {
            color: #dc2626;
            font-size: 0.875rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>

<body>

    <button id="theme-toggle" class="theme-btn">Modo Oscuro</button>
    <div class="login-card">
        <img src="assets/logo.png" alt="Logo del Sistema" class="logo" id="logo-img">

        <h2>Iniciar Sesión</h2>

        <form id="login-form">
            <div class="input-group">
                <input type="text" id="username" placeholder="Usuario" required autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Contraseña" required>
            </div>

            <button type="submit">Entrar</button>
            <div id="error-msg">Usuario o contraseña incorrectos.</div>
        </form>
    </div>

    <script>
        const btnTheme = document.getElementById('theme-toggle');
        const body = document.body;

        if (localStorage.getItem('tema') === 'oscuro') {
            body.classList.add('dark-theme');
            btnTheme.textContent = 'Modo Claro';
        }

        btnTheme.addEventListener('click', () => {
            body.classList.toggle('dark-theme');
            if (body.classList.contains('dark-theme')) {
                localStorage.setItem('tema', 'oscuro');
                btnTheme.textContent = 'Modo Claro';
            } else {
                localStorage.setItem('tema', 'claro');
                btnTheme.textContent = 'Modo Oscuro';
            }
        });

        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const userVal = document.getElementById('username').value;
            const passVal = document.getElementById('password').value;
            errorMsg.style.display = 'none';

            const response = await window.api.login(userVal, passVal);

            if (response.success) {
                localStorage.setItem('userId', response.userId);
                window.location.href = 'dashboard.html';
            } else {
                errorMsg.textContent = response.message;
                errorMsg.style.display = 'block';
            }
        });

    </script>
</body>

</html>
