<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema de Fichas</title>
    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-card: white;
            --text-main: #374151;
            --border-input: #d1d5db;
            --bg-input: white;
            --text-input: #000;
        }

        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 1.5rem;
        }

        body.dark-theme {
            --bg-body: #111827;
            --bg-card: #1f2937;
            --text-main: #f9fafb;
            --border-input: #4b5563;
            --bg-input: #374151;
            --text-input: #f9fafb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .login-card {
            background-color: var(--bg-card);
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 320px;
            text-align: center;
            transition: background-color 0.3s;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--border-input);
            background-color: var(--bg-input);
            color: var(--text-input);
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .theme-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: auto;
            background: none;
            border: 1px solid var(--border-input);
            color: var(--text-main);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: normal;
        }

        .theme-btn:hover {
            background-color: var(--border-input);
        }

        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #2563eb;
        }

        #error-msg {
            color: #dc2626;
            font-size: 0.875rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>

<body>
    <button id="theme-toggle" class="theme-btn">Modo Oscuro</button>
    <div class="login-card">
        <img src="assets/logo.png" alt="Logo del Sistema" class="logo" id="logo-img">

        <h2 id="titulo-form">Iniciar Sesión</h2>
        <form id="loginForm">
            <input type="text" id="nombre_completo" placeholder="Tu nombre completo (Ej. Juan Pérez)"
                style="display: none;" autocomplete="off">

            <input type="text" id="username" placeholder="Usuario (corto)" required autocomplete="off">
            <input type="password" id="password" placeholder="Contraseña" required>

            <button type="submit" class="btn" id="btn-submit">Entrar</button>
        </form>

        <p style="text-align: center; margin-top: 15px; font-size: 0.9em;">
            <a href="#" id="toggle-form" style="color: #3b82f6; text-decoration: none;">¿No tienes cuenta? Regístrate
                aquí</a>
        </p>
        <div id="message" class="error"></div>

    </div>

    <script>
        const btnTheme = document.getElementById('theme-toggle');
        const body = document.body;

        if (localStorage.getItem('tema') === 'oscuro') {
            body.classList.add('dark-theme');
            btnTheme.textContent = 'Modo Claro';
        }

        btnTheme.addEventListener('click', () => {
            body.classList.toggle('dark-theme');
            if (body.classList.contains('dark-theme')) {
                localStorage.setItem('tema', 'oscuro');
                btnTheme.textContent = 'Modo Claro';
            } else {
                localStorage.setItem('tema', 'claro');
                btnTheme.textContent = 'Modo Oscuro';
            }
        });

        const form = document.getElementById('loginForm');
        const toggleLink = document.getElementById('toggle-form');
        const tituloForm = document.getElementById('titulo-form');
        const btnSubmit = document.getElementById('btn-submit');
        const messageDiv = document.getElementById('message');
        const inputNombreCompleto = document.getElementById('nombre_completo');

        let modoRegistro = false;

        toggleLink.addEventListener('click', (e) => {
            e.preventDefault();
            modoRegistro = !modoRegistro;

            if (modoRegistro) {
                tituloForm.textContent = 'Crear Cuenta';
                btnSubmit.textContent = 'Registrarse';
                toggleLink.textContent = '¿Ya tienes cuenta? Inicia sesión';
                inputNombreCompleto.style.display = 'block';
                inputNombreCompleto.required = true;
            } else {
                tituloForm.textContent = 'Iniciar Sesión';
                btnSubmit.textContent = 'Entrar';
                toggleLink.textContent = '¿No tienes cuenta? Regístrate aquí';
                inputNombreCompleto.style.display = 'none';
                inputNombreCompleto.required = false;
                inputNombreCompleto.value = '';
            }
            messageDiv.textContent = '';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const nombreCompleto = inputNombreCompleto.value;

            let response;
            if (modoRegistro) {
                response = await window.api.registrar(user, nombreCompleto, pass);
            } else {
                response = await window.api.login(user, pass);
            }

            if (response.success) {
                localStorage.setItem('userId', response.userId);
                localStorage.setItem('userName', user);
                if (response.nombreCompleto) {
                    localStorage.setItem('userFullName', response.nombreCompleto);
                }
                if (response.rol) {
                    localStorage.setItem('userRol', response.rol);
                }

                window.location.href = 'dashboard.html';
            } else {
                messageDiv.textContent = response.message;
            }
        });
    </script>
</body>

</html>
