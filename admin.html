<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <header>
        <div style="font-weight: bold; font-size: 1.2rem;">Panel de administración</div>

        <div class="user-menu-container" style="position: relative;">
            <button id="user-menu-btn" class="user-menu-btn">
                <span id="header-username">Hola, admin</span>
            </button>
            <div id="dropdown-menu" class="dropdown-content">
                <a href="dashboard.html" id="btn-admin">Panel principal</a>
                <a href="#" id="btn-logout" class="text-danger">Cerrar Sesión</a>
            </div>
        </div>
    </header>

    <div class="app-container">

        <aside class="sidebar">
            <a href="#" class="active">Gestión de usuarios</a>
            <a href="#">Configuración del sistema</a>
            <a href="#">Reportes de actividad</a>
            <a href="#">Respaldar Base de Datos</a>
        </aside>

        <main class="main-content">

            <div class="admin-card">
                <div class="header-card">
                    <h2 style="margin:0;">Gestión de Usuarios</h2>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuario (Corto)</th>
                            <th>Nombre Completo</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios">
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <div id="mi-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-titulo">Editar</h3>
            <input type="hidden" id="modal-id">
            <input type="hidden" id="modal-accion">
            <input type="text" id="modal-input" autocomplete="off">
            <div class="modal-buttons">
                <button id="modal-btn-cancelar" class="btn-cancel">Cancelar</button>
                <button id="modal-btn-guardar" class="btn-save">Guardar</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
