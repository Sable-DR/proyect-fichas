<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-card: white;
            --text-main: #374151;
            --border-input: #d1d5db;
            --hover-sidebar: #e5e7eb;
        }

        body.dark-theme {
            --bg-body: #111827;
            --bg-card: #1f2937;
            --text-main: #f9fafb;
            --border-input: #4b5563;
            --hover-sidebar: #374151;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-input);
            background-color: var(--bg-card);
            z-index: 10;
        }

        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border-input);
            display: flex;
            flex-direction: column;
            padding-top: 1rem;
        }

        .sidebar a {
            padding: 1rem 2rem;
            text-decoration: none;
            color: var(--text-main);
            display: block;
            transition: background-color 0.2s, border-left 0.2s;
            border-left: 4px solid transparent;
        }

        .sidebar a:hover {
            background-color: var(--hover-sidebar);
        }

        .sidebar a.active {
            font-weight: bold;
            background-color: var(--hover-sidebar);
            border-left: 4px solid #3b82f6;
        }

        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .admin-card {
            background-color: var(--bg-card);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            box-sizing: border-box;
        }

        .header-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border-input);
            padding-bottom: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-input);
        }

        .btn-action {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 0.85rem;
            margin-right: 5px;
        }

        .btn-edit {
            background-color: #3b82f6;
        }

        .btn-pass {
            background-color: #f59e0b;
        }

        .btn-toggle {
            background-color: #10b981;
        }

        .btn-disable {
            background-color: #ef4444;
        }

        .badge-admin {
            background: #8b5cf6;
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.8em;
        }

        .badge-user {
            background: #6b7280;
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.8em;
        }

        .user-menu-btn {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-input);
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            transition: background-color 0.3s;
        }

        .user-menu-btn:hover {
            background-color: var(--hover-sidebar);
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 110%;
            background-color: var(--bg-card);
            min-width: 200px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border: 1px solid var(--border-input);
            z-index: 1000;
            overflow: hidden;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-content a {
            color: var(--text-main);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 0.95rem;
        }

        .dropdown-content a:hover {
            background-color: var(--hover-sidebar);
        }

        .dropdown-content a.text-danger {
            color: #ef4444;
            border-top: 1px solid var(--border-input);
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-card);
            padding: 2rem;
            border-radius: 10px;
            width: 100%;
            max-width: 300px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 1px solid var(--border-input);
        }

        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 1rem;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--border-input);
            background-color: var(--bg-body);
            color: var(--text-main);
            border-radius: 5px;
            box-sizing: border-box;
        }

        .modal-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }

        .btn-cancel {
            background-color: #ef4444;
        }

        .btn-save {
            background-color: #3b82f6;
        }
    </style>
</head>

<body>

    <header>
        <div style="font-weight: bold; font-size: 1.2rem;">Panel de administración</div>

        <div class="user-menu-container" style="position: relative;">
            <button id="user-menu-btn" class="user-menu-btn">
                <span id="header-username">Hola, admin</span>
            </button>
            <div id="dropdown-menu" class="dropdown-content">
                <a href="dashboard.html" id="btn-admin">Panel principal</a>
                <a href="#" id="btn-logout" class="text-danger">Cerrar Sesión</a>
            </div>
        </div>
    </header>

    <div class="app-container">

        <aside class="sidebar">
            <a href="#" class="active">Gestión de usuarios</a>
            <a href="#">Configuración del sistema</a>
            <a href="#">Reportes de actividad</a>
            <a href="#">Respaldar Base de Datos</a>
        </aside>

        <main class="main-content">

            <div class="admin-card">
                <div class="header-card">
                    <h2 style="margin:0;">Gestión de Usuarios</h2>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuario (Corto)</th>
                            <th>Nombre Completo</th>
                            <th>Rol</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-usuarios">
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <div id="mi-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-titulo">Editar</h3>
            <input type="hidden" id="modal-id">
            <input type="hidden" id="modal-accion">
            <input type="text" id="modal-input" autocomplete="off">
            <div class="modal-buttons">
                <button id="modal-btn-cancelar" class="btn-cancel">Cancelar</button>
                <button id="modal-btn-guardar" class="btn-save">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        if (localStorage.getItem('tema') === 'oscuro') {
            document.body.classList.add('dark-theme');
        }

        const currentFullName = localStorage.getItem('userFullName') || localStorage.getItem('userName') || 'Usuario';
        document.getElementById('header-username').textContent = 'Hola, ' + currentFullName;

        const tabla = document.getElementById('tabla-usuarios');
        async function cargarUsuarios() {
            const response = await window.api.obtenerUsuarios();

            if (response.success) {
                tabla.innerHTML = '';

                response.data.forEach(user => {
                    const tr = document.createElement('tr');
                    const estadoTexto = user.activo ? '🟢 Activo' : '🔴 Inactivo';
                    const rolBadge = user.rol === 'admin' ? '<span class="badge-admin">Admin</span>' : '<span class="badge-user">User</span>';
                    const toggleAction = user.activo ? 0 : 1;
                    const toggleColorClass = user.activo ? 'btn-disable' : 'btn-toggle';
                    const toggleBtnText = user.activo ? 'Desactivar' : 'Activar';
                    const isSuperAdmin = user.id === 1;

                    tr.innerHTML = `
                        <td>${user.id}</td>
                        <td><strong>${user.username}</strong></td>
                        <td>${user.nombre_completo || 'N/A'}</td>
                        <td>${rolBadge}</td>
                        <td>${estadoTexto}</td>
                        <td>
                            <button class="btn-action btn-edit" onclick="editar(${user.id}, '${user.username}')">Nombre Corto</button>
                            <button class="btn-action btn-pass" onclick="cambiarPass(${user.id})">Contraseña</button>
                            ${!isSuperAdmin ? `<button class="btn-action ${toggleColorClass}" onclick="toggleEstado(${user.id}, ${toggleAction})">${toggleBtnText}</button>` : ''}
                        </td>
                    `;
                    tabla.appendChild(tr);
                });
            } else {
                alert('Error al cargar usuarios: ' + response.message);
            }
        }

        const modal = document.getElementById('mi-modal');
        const modalTitulo = document.getElementById('modal-titulo');
        const modalInput = document.getElementById('modal-input');
        const modalId = document.getElementById('modal-id');
        const modalAccion = document.getElementById('modal-accion');

        function cerrarModal() {
            modal.classList.remove('show');
            modalInput.value = '';
        }
        document.getElementById('modal-btn-cancelar').addEventListener('click', cerrarModal);

        function editar(id, nombreActual) {
            modalTitulo.textContent = "Nuevo nombre de usuario (corto):";
            modalInput.type = "text";
            modalInput.value = nombreActual;
            modalId.value = id;
            modalAccion.value = "nombre";
            modal.classList.add('show');
            modalInput.focus();
        }

        function cambiarPass(id) {
            modalTitulo.textContent = "Nueva contraseña:";
            modalInput.type = "password";
            modalInput.value = "";
            modalId.value = id;
            modalAccion.value = "pass";
            modal.classList.add('show');
            modalInput.focus();
        }

        document.getElementById('modal-btn-guardar').addEventListener('click', async () => {
            const id = modalId.value;
            const accion = modalAccion.value;
            const nuevoValor = modalInput.value.trim();

            if (!nuevoValor) {
                alert("El campo no puede estar vacío");
                return;
            }

            if (accion === 'nombre') {
                const res = await window.api.editarUsuario(id, nuevoValor);
                if (res.success) {
                    cargarUsuarios();
                    cerrarModal();
                } else {
                    alert('Error: ' + res.message);
                }
            } else if (accion === 'pass') {
                const res = await window.api.cambiarPassword(id, nuevoValor);
                if (res.success) {
                    alert('Contraseña actualizada con éxito.');
                    cerrarModal();
                } else {
                    alert('Error: ' + res.message);
                }
            }
        });

        async function toggleEstado(id, nuevoEstado) {
            const accion = nuevoEstado === 1 ? 'ACTIVAR' : 'DESACTIVAR';
            if (confirm(`¿Estás seguro de que deseas ${accion} a este usuario?`)) {
                const res = await window.api.cambiarEstadoUsuario(id, nuevoEstado);
                if (res.success) {
                    cargarUsuarios();
                } else {
                    alert('Error: ' + res.message);
                }
            }
        }

        const menuBtn = document.getElementById('user-menu-btn');
        const dropdownMenu = document.getElementById('dropdown-menu');

        menuBtn.addEventListener('click', (event) => {
            dropdownMenu.classList.toggle('show');
            event.stopPropagation();
        });

        window.addEventListener('click', (event) => {
            if (!event.target.closest('.user-menu-container')) {
                if (dropdownMenu.classList.contains('show')) {
                    dropdownMenu.classList.remove('show');
                }
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = 'index.html';
        });

        cargarUsuarios();

    </script>
</body>

</html>
