<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novedades en turno</title>
    <link rel="stylesheet" href="dashboard.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>



    <header>
        <div style="font-weight: bold; font-size: 1.2rem;">Novedades en turno</div>
        <div class="user-menu-container" style="position: relative;">
            <button id="user-menu-btn" class="user-menu-btn">
                <span id="header-username">Hola, Usuario</span>
            </button>
            <div id="dropdown-menu" class="dropdown-content">
                <a href="admin.html" id="btn-admin">Panel de Administración</a>
                <a href="#" id="btn-logout" class="text-danger">Cerrar Sesión</a>
            </div>
        </div>
    </header>

    <div class="app-container">

        <aside class="sidebar-form">
            <h3>Nueva Ficha</h3>
            <form id="form-ficha">

                <div class="form-row" style="display: flex; gap: 10px; margin-bottom: 1rem;">
                    <div class="form-group" style="margin-bottom: 0; flex: 1;">
                        <input type="date" id="fecha" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 0; flex: 1;">
                        <input type="time" id="hora" required>
                    </div>
                </div>

                <!-- 1. TIPO DE AUXILIO PRIMERO -->
                <div class="form-group">
                    <input type="text" id="tipo-auxilio" list="list-auxilios" placeholder="Tipo de auxilio..." required
                        autocomplete="off">
                    <datalist id="list-auxilios"></datalist>
                </div>

                <div class="form-group">
                    <input type="text" id="medio-reporte" list="list-medios" placeholder="Medio del reporte..." required
                        autocomplete="off">
                    <datalist id="list-medios"></datalist>
                </div>

                <div class="form-group">
                    <input type="text" id="direccion" placeholder="Dirección exacta" required autocomplete="off">
                </div>

                <div class="form-group">
                    <input type="text" id="colonia" list="list-colonias"
                        placeholder="Colonia / Fraccionamiento / Comisaria..." required autocomplete="off">
                    <datalist id="list-colonias"></datalist>
                </div>

                <div class="form-group">
                    <textarea id="descripcion" placeholder="Escribe la descripción aquí..." rows="3"
                        required></textarea>
                </div>

                <div class="form-group">
                    <input type="text" id="unidad" list="list-unidades" placeholder="Unidad que atiende..." required
                        autocomplete="off">
                    <datalist id="list-unidades"></datalist>
                </div>

                <div class="form-group">
                    <select id="estado" required>
                        <option value="PENDIENTE" selected>PENDIENTE</option>
                        <option value="LISTO">LISTO</option>
                        <option value="CANALIZADO">CANALIZADO</option>
                    </select>
                </div>

                <div class="form-group">
                    <select id="veracidad" required></select>
                </div>
                
                <div id="map-formulario"
                    style="height: 250px; width: 100%; border-radius: 8px; margin-bottom: 15px; border: 1px solid #4b5563;">
                </div>

                <button type="submit" class="btn-submit">Guardar Ficha</button>
            </form>
        </aside>

        <main class="main-content">

            <div class="stats-bar">
                <div class="stats-cards">
                    <div class="stat-card">
                        <span class="stat-title">Pendientes</span>
                        <span class="stat-value" id="count-pendientes">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-title">Falsos</span>
                        <span class="stat-value" id="count-falsos">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-title">Verdaderos</span>
                        <span class="stat-value" id="count-verdaderos">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-title">Canalizado</span>
                        <span class="stat-value" id="count-canalizado">0</span>
                    </div>
                    <div class="stat-card highlight">
                        <span class="stat-title">Total General</span>
                        <span class="stat-value" id="count-total">0</span>
                    </div>
                </div>

                <div class="filter-controls">
                    <div class="btn-group">
                        <button id="filtro-todo" class="btn-filter active">VER TODO</button>
                        <button id="filtro-pendientes" class="btn-filter">PENDIENTES</button>
                    </div>

                    <div class="search-box">
                        <input type="text" id="busqueda-fichas" placeholder="Buscar por tipo o dirección...">
                    </div>
                </div>
            </div>

            <div id="contenedor-fichas" class="fichas-grid"></div>

        </main>

    </div>

    <div id="modal-ficha" class="modal-overlay">
        <div class="modal-content">
            <span id="btn-cerrar-modal" class="modal-close-btn">×</span>

            <h2
                style="margin-top: 0; border-bottom: 2px solid var(--border-input); padding-bottom: 10px; color: var(--primary-color);">
                Detalles Completos de la Ficha
            </h2>

            <div id="contenido-modal-ficha"></div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
