<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novedades en turno</title>
    <link rel="stylesheet" href="dashboard.css">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>

    <header>
        <div style="font-weight: bold; font-size: 1.2rem;">Novedades en turno</div>
        <div class="user-menu-container" style="position: relative;">
            <button id="user-menu-btn" class="user-menu-btn">
                <span id="header-username">Hola, Usuario</span>
            </button>
            <div id="dropdown-menu" class="dropdown-content">
                <a href="admin.html" id="btn-admin" style="display: none;">Panel de Administración</a>
                <a href="#" id="btn-logout"
                    style="color: #ef4444; border-top: 1px solid var(--border-input); font-weight: bold;">Cerrar
                    Sesión</a>
            </div>
        </div>
    </header>

    <div class="app-container">

        <aside class="sidebar-form">
            <h3>Nueva Ficha</h3>
            <form id="form-ficha">

                <div class="form-row" style="display: flex; gap: 10px; margin-bottom: 1rem;">
                    <div class="form-group" style="margin-bottom: 0; flex: 1;">
                        <input type="date" id="fecha" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 0; flex: 1;">
                        <input type="time" id="hora" required>
                    </div>
                </div>

                <div class="form-group">
                    <input type="text" id="titulo" placeholder="Título corto (Ej. Choque Centro)" required
                        autocomplete="off">
                </div>

                <div class="form-group">
                    <select id="medio-reporte" required>
                        <option value="" disabled selected>Medio del reporte...</option>
                        <option value="911">Llamada 911</option>
                        <option value="Radio">Vía Radio</option>
                        <option value="Directo">Reporte Directo / Ciudadano</option>
                        <option value="Camaras">Cámaras de Vigilancia</option>
                    </select>
                </div>

                <div class="form-group">
                    <input type="text" id="direccion" placeholder="Dirección exacta" required autocomplete="off">
                </div>

                <div class="form-group">
                    <input type="text" id="colonia" placeholder="Colonia / Sector" required autocomplete="off">
                </div>

                <div class="form-group">
                    <textarea id="descripcion" placeholder="Escribe la descripción aquí..." rows="3"
                        required></textarea>
                </div>

                <div class="form-group">
                    <select id="tipo-auxilio" required>
                        <option value="" disabled selected>Tipo de auxilio...</option>
                        <option value="Medico">Médico</option>
                        <option value="Incendio">Incendio</option>
                        <option value="Rescate">Rescate</option>
                        <option value="Seguridad">Seguridad Pública</option>
                    </select>
                </div>

                <div class="form-group">
                    <select id="unidad" required>
                        <option value="" disabled selected>Unidad que atiende...</option>
                        <option value="Ambulancia 01">Ambulancia 01</option>
                        <option value="Unidad de Rescate">Unidad de Rescate</option>
                        <option value="Bomberos 01">Bomberos 01</option>
                    </select>
                </div>

                <div class="form-group">
                    <select id="estado" required>
                        <option value="PENDIENTE" selected>PENDIENTE</option>
                        <option value="LISTO">LISTO</option>
                    </select>
                </div>

                <div id="map-formulario"
                    style="height: 250px; width: 100%; border-radius: 8px; margin-bottom: 15px; border: 1px solid #4b5563;">
                </div>

                <div class="form-group">
                    <select id="veracidad" required>
                        <option value="Verdadera" selected>Reporte Real</option>
                        <option value="Falsa">Reporte Falsa</option>
                        <option value="Canalizado">Reporte Canalizado</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Guardar Ficha</button>
            </form>
        </aside>

        <main class="main-content">

            <div class="stats-bar">
                <div class="stats-cards">
                    <div class="stat-card">
                        <span class="stat-title">Pendientes</span>
                        <span class="stat-value" id="count-pendientes">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-title">Falsos</span>
                        <span class="stat-value" id="count-falsos">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-title">Verdaderos</span>
                        <span class="stat-value" id="count-verdaderos">0</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-title">Canalizado</span>
                        <span class="stat-value" id="count-canalizado">0</span>
                    </div>
                    <div class="stat-card highlight">
                        <span class="stat-title">Total General</span>
                        <span class="stat-value" id="count-total">0</span>
                    </div>
                </div>

                <div class="filter-controls">
                    <div class="btn-group">
                        <button id="filtro-todo" class="btn-filter active">VER TODO</button>
                        <button id="filtro-pendientes" class="btn-filter">PENDIENTES</button>
                    </div>

                    <div class="search-box">
                        <input type="text" id="busqueda-fichas" placeholder="Buscar por título o dirección...">
                    </div>
                </div>
            </div>

            <div id="contenedor-fichas" class="fichas-grid"></div>

        </main>

    </div>

    <div id="modal-ficha" class="modal-overlay"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(3px);">
        <div class="modal-content"
            style="background-color: var(--bg-card); padding: 2.5rem; border-radius: 15px; width: 600px; max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); border: 1px solid var(--border-input); color: var(--text-main); position: relative;">

            <span id="btn-cerrar-modal"
                style="position: absolute; top: 15px; right: 20px; font-size: 1.8rem; cursor: pointer; color: #ef4444; font-weight: bold; transition: transform 0.2s;">×</span>

            <h2
                style="margin-top: 0; border-bottom: 2px solid var(--border-input); padding-bottom: 10px; color: var(--primary-color);">
                Detalles
                Completos de la Ficha</h2>

            <div id="contenido-modal-ficha"></div>

        </div>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
